<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Kazuki Turismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?q=80&w=1600') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .form-label-custom {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4a5568;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .btn-gold {
            background-color: #dfa836;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
        }
        .btn-gold:hover {
            background-color: #c5922b;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(197, 146, 43, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">Kazuki <span style="color: #dfa836;">Turismo</span></h2>
            <p class="text-muted small">Ingresa tus credenciales de reserva</p>
        </div>

        <div th:if="${error}" class="alert alert-danger text-center py-2 mb-3 small" style="border-radius: 8px;">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/cliente/login-procesar}" method="post">
            <div class="mb-3">
                <label class="form-label-custom"><i class="fa-solid fa-envelope me-1 text-warning"></i> Correo Electrónico</label>
                <input type="email" name="correo" class="form-control" placeholder="ejemplo@mail.com" required />
            </div>

            <div class="mb-4">
                <label class="form-label-custom"><i class="fa-solid fa-lock me-1 text-warning"></i> Contraseña de 4 dígitos</label>
                <input type="password" 
                       name="contrasena" 
                       class="form-control" 
                       placeholder="xxxx" 
                       maxlength="4"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                       required />
            </div>

            <button type="submit" class="btn btn-gold w-100 py-2.5 rounded-3 mb-2">
                Ingresar al Sistema <i class="fa-solid fa-right-to-bracket ms-1"></i>
            </button>
            
            <a th:href="@{/cliente/catalogo}" class="btn btn-light w-100 btn-sm text-muted">Volver al Catálogo</a>
        </form>
    </div>

</body>
</html>
