<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Servicio - Kazuki Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Administración*/
        .admin-card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
            background: #ffffff; 
        }
        
        /* Controles de formulario */
        .form-label-premium {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .form-control-premium {
            border: 1px solid #e2e8f0; 
            padding: 12px 15px; 
            border-radius: 10px; 
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .form-control-premium:focus { 
            border-color: #dfa836; 
            box-shadow: 0 0 0 3px rgba(223, 168, 54, 0.15); 
        }
        
        /* Botones de acción */
        .btn-gold-save { 
            background-color: #dfa836; 
            color: #ffffff; 
            font-weight: 600; 
            border-radius: 10px; 
            padding: 12px; 
            border: none;
            transition: all 0.3s ease;
        }
        .btn-gold-save:hover { 
            background-color: #c5922b; 
            color: #ffffff; 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(197, 146, 43, 0.25);
        }
        .btn-premium-light {
            background-color: #f1f5f9;
            color: #64748b;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        .btn-premium-light:hover {
            background-color: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 620px;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">
                <i class="fa-solid fa-pen-to-square text-warning me-2" th:if="${servicioDTO.idServicio != null}"></i>
                <i class="fa-solid fa-circle-plus text-warning me-2" th:if="${servicioDTO.idServicio == null}"></i>
                <span th:text="${servicioDTO.idServicio != null} ? 'Editar Servicio Turístico' : 'Registrar Nuevo Servicio'"></span>
            </h2>
            <p class="text-muted small">Actualiza o añade las especificaciones de alojamiento expuestas en el catálogo</p>
        </div>

        <div class="card admin-card p-4 p-md-5">
            <form th:action="@{/servicios/guardar}" th:object="${servicioDTO}" method="post">
                <input type="hidden" th:field="*{idServicio}" />

                <div class="mb-4">
                    <label class="form-label-premium"><i class="fa-solid fa-hotel me-2 text-secondary"></i>Nombre del Hostal / Plan</label>
                    <input type="text" th:field="*{nombreHostal}" class="form-control form-control-premium" placeholder="Ej: Hostal Pradera Real" required/>
                </div>

                <div class="mb-4">
                    <label class="form-label-premium"><i class="fa-solid fa-circle-info me-2 text-secondary"></i>Tipo de Hospedaje</label>
                    <input type="text" th:field="*{tipoHostal}" class="form-control form-control-premium" placeholder="Ej: Hostal Rural / Cabaña Premium" required/>
                </div>

                <div class="row mb-5">
                    <div class="col-sm-6 mb-4 mb-sm-0">
                        <label class="form-label-premium"><i class="fa-solid fa-users me-2 text-secondary"></i>Huéspedes Máximos</label>
                        <input type="number" th:field="*{huespedesMax}" class="form-control form-control-premium" placeholder="Ej: 4" min="1" required/>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label-premium"><i class="fa-solid fa-hand-holding-dollar me-2 text-secondary"></i>Valor por Noche / Entrada</label>
                        <input type="number" th:value="${servicioDTO.valor != null ? #numbers.formatDecimal(servicioDTO.valor, 1, 0) : 0}" name="valor" class="form-control form-control-premium" placeholder="Ej: 150000" min="0" required/>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-6">
                        <a th:href="@{/servicios}" class="btn btn-premium-light d-block">Cancelar</a>
                    </div>
                    <div class="col-6">
                        <button type="submit" class="btn btn-gold-save w-100">
                            Guardar Cambios <i class="fa-solid fa-floppy-disk ms-1 small"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
        
    </div>
</body>
</html>
