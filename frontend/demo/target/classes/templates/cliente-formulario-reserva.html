<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de tu Reserva - Kazuki Turismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1600') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        
        .booking-bar {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .form-group-inner {
            border-right: 1px solid #e2e8f0;
            padding-right: 15px;
        }
        
        @media (max-width: 991px) {
            .form-group-inner {
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
                padding-bottom: 15px;
                margin-bottom: 15px;
                padding-right: 0;
            }
        }
        
        .form-label-custom {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }
        
        .input-custom {
            border: none;
            background: transparent;
            font-weight: 600;
            color: #1a202c;
            padding: 0;
        }
        
        .input-custom:focus {
            background: transparent;
            box-shadow: none;
            border: none;
        }
        
        .btn-booking {
            background-color: #dfa836;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: none;
        }
        
        .btn-booking:hover {
            background-color: #c5922b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(197, 146, 43, 0.35);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-center text-white mb-5">
            <h1 class="display-4 fw-bold mb-2">Reserva tu Estadía Ideal</h1>
            <p class="lead opacity-90">Planifica tus vacaciones perfectas en <span th:text="${reserva.servicio.nombreHostal}" class="text-warning fw-bold"></span></p>
        </div>

        <div class="booking-bar p-4">
            <form th:action="@{/cliente/checkout}" th:object="${reserva}" method="post">
                
                <input type="hidden" th:field="*{servicio.idServicio}" />
                <input type="hidden" name="idServicioOculto" th:value="*{servicio.idServicio}" />

                <div class="row align-items-center g-3">
                    
                    <div class="col-lg-3 col-md-6">
                        <div class="form-group-inner">
                            <label class="form-label-custom"><i class="fa-solid fa-hotel me-2 text-warning"></i>Alojamiento</label>
                            <input type="text" th:field="*{servicio.nombreHostal}" class="form-control input-custom fs-5" readonly/>
                        </div>
                    </div>

                    <div class="col-lg-3 col-md-6">
                        <div class="form-group-inner">
                            <label class="form-label-custom"><i class="fa-regular fa-calendar-check me-2 text-warning"></i>Check-In</label>
                            <input type="date" th:field="*{fechaInicio}" class="form-control input-custom fs-6" required/>
                        </div>
                    </div>

                    <div class="col-lg-3 col-md-6">
                        <div class="form-group-inner">
                            <label class="form-label-custom"><i class="fa-regular fa-calendar-xmark me-2 text-warning"></i>Check-Out</label>
                            <input type="date" name="fechaSalida" class="form-control input-custom fs-6" required/>
                        </div>
                    </div>

                    <div class="col-lg-2 col-md-6">
                        <div class="form-group-inner border-0">
                            <label class="form-label-custom"><i class="fa-solid fa-users me-2 text-warning"></i>Huéspedes</label>
                            <input type="number" 
                                   th:value="${reserva.huspedes != null ? #numbers.formatDecimal(reserva.huspedes, 1, 0) : 1}" 
                                   name="huspedes"
                                   id="huspedes"
                                   class="form-control input-custom fs-5" 
                                   min="1" 
                                   max="10" 
                                   oninput="if(parseInt(this.value) > 10) this.value = 10; if(parseInt(this.value) < 1) this.value = 1;"
                                   required/>
                        </div>
                    </div>

                    <div class="col-lg-1 col-md-12 text-center mt-3 mt-lg-0">
                        <button type="submit" class="btn btn-booking w-100 py-3 py-lg-4" title="Calcular Estadía y Continuar">
                            <i class="fa-solid fa-arrow-right fs-4"></i>
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <script>
        const inputIngreso = document.querySelector('input[th\\:field="*{fechaInicio}"]') || document.querySelector('input[name="fechaInicio"]') || document.querySelectorAll('input[type="date"]')[0];
        const inputSalida = document.querySelector('input[name="fechaSalida"]');

        if (inputIngreso && inputSalida) {
            const hoy = new Date().toISOString().split("T")[0];
            inputIngreso.setAttribute("min", hoy);

            inputIngreso.addEventListener("change", function () {
                if (inputIngreso.value) {
                    let fechaMinSalida = new Date(inputIngreso.value);
                    fechaMinSalida.setDate(fechaMinSalida.getDate() + 1);
                    
                    const formatoMin = fechaMinSalida.toISOString().split("T")[0];
                    inputSalida.setAttribute("min", formatoMin);
                    
                    if (inputSalida.value && inputSalida.value <= inputIngreso.value) {
                        inputSalida.value = formatoMin;
                    }
                }
            });
        }
    </script>
</body>
</html>
