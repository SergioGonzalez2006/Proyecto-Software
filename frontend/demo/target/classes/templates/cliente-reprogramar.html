<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reprogramar Viaje - Kazuki Turismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; min-height: 100vh; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .btn-gold { background-color: #dfa836; color: white; border: none; font-weight: 600; }
        .btn-gold:hover { background-color: #c5922b; color: white; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold"><i class="fa-solid fa-calendar-plus text-warning me-2"></i>Reprogramar Estadía</h3>
            <p class="text-muted small">Selecciona los nuevos rangos de fechas para tu viaje</p>
        </div>
        <div class="card card-custom p-4 bg-white">
            <form th:action="@{/cliente/reservas/actualizar}" th:object="${reserva}" method="POST">
                <input type="hidden" th:field="*{idReserva}" />
                <input type="hidden" th:field="*{servicio.idServicio}" />
                <input type="hidden" th:field="*{usuario.idUsuario}" />
                <input type="hidden" th:field="*{huspedes}" />
                <input type="hidden" th:field="*{pagoTotal}" />
                <input type="hidden" th:field="*{estadoReserva}" />

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Nueva Fecha de Check-In</label>
                    <input type="date" class="form-control" th:field="*{fechaInicio}" required />
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary">Nueva Fecha de Check-Out</label>
                    <input type="date" class="form-control" th:field="*{fechaFinal}" required />
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-gold w-100 py-2.5">Confirmar Cambio</button>
                    <a th:href="@{/cliente/perfil}" class="btn btn-light border w-100 py-2.5">Regresar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
