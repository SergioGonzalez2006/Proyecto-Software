<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Kazuki Turismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?q=80&w=1200') no-repeat center center fixed; 
            background-size: cover; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            align-items: center; 
            min-height: 100vh; 
        }
        .login-card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            background: rgba(255, 255, 255, 0.96); 
            backdrop-filter: blur(10px); 
        }
        .btn-gold { 
            background-color: #dfa836; 
            color: white; 
            font-weight: 600; 
            border-radius: 10px; 
            border: none; 
            transition: 0.3s; 
        }
        .btn-gold:hover { 
            background-color: #c5922b; 
            color: white; 
            transform: translateY(-1px); 
        }
        .brand-gold { color: #dfa836; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <div class="card login-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark"><i class="fa-solid fa-shield-halved brand-gold me-2"></i>Kazuki <span class="brand-gold">Turismo</span></h3>
                <p class="text-muted small">Ingresa tus credenciales para gestionar tus viajes</p>
            </div>

            <div th:if="${error}" class="alert alert-danger text-center small py-2" th:text="${error}"></div>

            <form th:action="@{/cliente/login}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                    <input type="email" name="correo" class="form-control py-2.5" placeholder="ejemplo@mail.com" required />
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <input type="password" name="contrasena" class="form-control py-2.5" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-gold w-100 py-2.5 shadow-sm">Ingresar al Portal <i class="fa-solid fa-right-to-bracket ms-1"></i></button>
            </form>
        </div>
    </div>
</body>
</html>
