<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pasarela de Pagos Segura - Kazuki Turismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Contenedor flotante */
        .checkout-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.05);
            padding: 35px;
        }
        
        /* Desglose de precio */
        .price-breakdown-box {
            background-color: rgba(223, 168, 54, 0.06);
            border: 1px dashed rgba(223, 168, 54, 0.4);
            border-radius: 12px;
            padding: 18px;
        }
        .text-gold-price {
            color: #dfa836;
            font-weight: 700;
            font-size: 1.4rem;
        }

        /* Campos de texto */
        .form-label-premium {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .form-control-premium {
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .form-control-premium:focus {
            border-color: #dfa836;
            box-shadow: 0 0 0 3px rgba(223, 168, 54, 0.15);
        }

        /* Botón */
        .btn-gold-submit {
            background-color: #dfa836;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s ease;
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
        }
        .btn-gold-submit:hover {
            background-color: #c5922b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 146, 43, 0.3);
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 520px;">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-lock text-warning me-2"></i>Pasarela Segura</h3>
            <p class="text-muted small">Cifrado de transacciones de extremo a extremo</p>
        </div>

        <div class="card checkout-card shadow-lg">
            
            <div class="price-breakdown-box text-center mb-4">
                <span class="text-muted small d-block mb-1">Monto a Transferir</span>
                <strong class="text-gold-price" th:text="|COP $${#numbers.formatDecimal(reserva.pagoTotal != null ? reserva.pagoTotal : 0, 1, 'POINT', 0, 'COMMA')}|"></strong>
                <div class="text-secondary small mt-1" style="font-size: 0.8rem;" th:text="|Calculado por ${nochesEstadia} noches de estadía|"></div>
            </div>
            
            <form th:action="@{/cliente/confirmar-pago}" th:object="${reserva}" method="post">
                <input type="hidden" th:field="*{servicio.idServicio}" />
                <input type="hidden" th:field="*{fechaInicio}" />
                <input type="hidden" th:field="*{fechaFinal}" />
                <input type="hidden" th:field="*{huspedes}" />
                <input type="hidden" th:field="*{pagoTotal}" />
                <input type="hidden" th:field="*{estadoReserva}" />

                <div class="mb-3">
                    <label class="form-label-premium"><i class="fa-solid fa-signature text-secondary me-2"></i>Nombre del usuario</label>
                    <input type="text" th:field="*{usuario.nombre}" class="form-control form-control-premium" placeholder="Ej: Carlos Mendoza" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label-premium"><i class="fa-solid fa-credit-card text-secondary me-2"></i>Número de Tarjeta</label>
                    <input type="text" 
                           class="form-control form-control-premium" 
                           placeholder="4557 •••• •••• 8892" 
                           maxlength="16"
                           inputmode="numeric"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                           required/>
                </div>

                <div class="row mb-4">
                    <div class="col-6">
                        <label class="form-label-premium"><i class="fa-regular fa-calendar text-secondary me-2"></i>Vencimiento</label>
                        <input type="text" 
                               class="form-control form-control-premium text-center" 
                               placeholder="MM/AA" 
                               maxlength="5"
                               oninput="this.value = this.value.replace(/[^0-9/]/g, '')" 
                               required/>
                    </div>
                    
                    <div class="col-6">
                        <label class="form-label-premium"><i class="fa-solid fa-key text-secondary me-2"></i>CVC</label>
                        <input type="text" 
                               class="form-control form-control-premium text-center" 
                               placeholder="123" 
                               maxlength="3"
                               inputmode="numeric"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                               required/>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label-premium"><i class="fa-solid fa-envelope me-2 text-warning"></i>Correo Electrónico para tu Cuenta</label>
                    <input type="email" th:field="*{usuario.correo}" class="form-control form-control-premium" placeholder="ejemplo@correo.com" required />
                </div>

                <div class="mb-4">
                    <label class="form-label-premium"><i class="fa-solid fa-lock me-2 text-warning"></i>Crea una Contraseña de Acceso (4 Números)</label>
                    <input type="password" th:field="*{usuario.contrasena}" class="form-control form-control-premium" placeholder="Ej: 1234" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length > 4) this.value = this.value.slice(0,4);" required />
                </div>

                <button type="submit" class="btn btn-gold-submit w-100 shadow-sm">
                    Confirmar Pago <i class="fa-solid fa-circle-check ms-1"></i>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
